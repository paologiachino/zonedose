info:
  name: List users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/admin/users?status=pending"
  params:
    - name: status
      value: pending
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true

docs: |-
  Users, oldest first. `status` is optional: `pending`, `active` or `disabled`
  (disable the parameter to list everyone).

  - `200`: the list (also `created_at`, `last_login_at`, `approved_at`,
    `approved_by`).
  - `401` not signed in, `403` not an active administrator, `422` unknown status.

  Needs a signed-in admin session (see auth/Me for using browser cookies).
