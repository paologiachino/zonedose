info:
  name: Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true

docs: |-
  The signed-in user: `id`, `email`, `display_name`, `status`, `role`.

  - `200`: signed in (also for a `pending` account, so the interface can show
    "waiting for approval").
  - `401`: no session cookie, or the session ended.

  The session lives in an HttpOnly cookie set by the Google sign-in in a
  browser. To use it here, see "Using a browser session" in `bruno/README.md`.
