info:
  name: Google login
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/auth/google/login"

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  Starts the Google sign-in. Meant for a browser: open
  http://localhost:8080/api/auth/google/login there to sign in for real.

  - `302`: redirect to Google, with `state` and the PKCE challenge in the URL.
  - `302` to `/login?error=unavailable`: ZONEDOSE_GOOGLE_CLIENT_ID and
    ZONEDOSE_GOOGLE_CLIENT_SECRET are not set (see docs/google-oauth.md).

  Google then sends the browser to /api/auth/google/callback (handled by
  ASP.NET), which hands over to /api/auth/google/finish: it opens the session,
  sets the HttpOnly session cookie and redirects to `/`. A failed sign-in
  redirects to `/login?error=<code>`: `cancelled`, `failed`,
  `unverified_email`, `unavailable`, `disabled`. Neither step has a request
  here: only the browser coming back from Google calls them.
