version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # Orchard Core and the pinned transitive packages (Directory.Packages.props).
  # Orchard packages move together, so they arrive in one pull request; majors
  # are planned upgrades, not automatic ones.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      orchard-core:
        patterns:
          - "OrchardCore.*"
    ignore:
      - dependency-name: "OrchardCore.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
